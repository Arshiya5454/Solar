<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مقالات | دانشنامه انرژی خورشیدی | برق‌آوران هوراد</title>
  <meta name="description" content="مقالات تخصصی آموزش انرژی خورشیدی، پنل‌های خورشیدی، اینورتر، باتری و راهنمای خرید تجهیزات" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    .blog-header {
      padding: 120px 0 40px;
      background: linear-gradient(135deg, #f8fffb, #e6f5ec);
      text-align: center;
    }
    .blog-header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--secondary);
    }
    .blog-header h1 span {
      color: var(--primary);
    }
    .blog-header p {
      color: var(--text-light);
      max-width: 600px;
      margin: 8px auto 0;
    }

    .blog-archive {
      padding: 48px 0 80px;
      background: var(--white);
    }
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 32px;
    }

    .blog-card {
      background: var(--white);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      border: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
    }
    .blog-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.12);
      border-color: var(--primary);
    }
    .blog-card__image {
      height: 180px;
      background: linear-gradient(135deg, var(--primary-light), #d4f0e0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .blog-card__body {
      padding: 20px 24px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .blog-card__date {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .blog-card__title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .blog-card__title a {
      color: inherit;
      text-decoration: none;
      transition: var(--transition);
    }
    .blog-card__title a:hover {
      color: var(--primary);
    }
    .blog-card__excerpt {
      color: var(--text-light);
      font-size: 0.95rem;
      line-height: 1.7;
      flex: 1;
      margin-bottom: 16px;
    }
    .blog-card__readmore {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }
    .blog-card__readmore:hover {
      gap: 12px;
    }

    .blog-empty {
      text-align: center;
      padding: 80px 0;
      color: var(--text-light);
    }
    .blog-empty h3 {
      font-size: 1.5rem;
      color: var(--secondary);
      margin-bottom: 8px;
    }

    @media (max-width: 768px) {
      .blog-header h1 {
        font-size: 2rem;
      }
      .blog-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

    articles

      <a href="consultation.html" class="btn btn-primary">درخواست مشاوره</a>

        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<!-- ===== BLOG HEADER ===== -->
<section class="blog-header">
  <div class="container">
    <h1>دانشنامه <span>انرژی خورشیدی</span></h1>
    <p>مقالات تخصصی و آموزشی در حوزه انرژی خورشیدی، پنل، اینورتر و باتری</p>
  </div>
</section>

<!-- ===== BLOG ARCHIVE ===== -->
<section class="blog-archive">
  <div class="container">
    <div class="blog-grid" id="blogGrid"></div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="footer">
  <div class="container">
    <p>برق‌آوران هوراد | مجری تخصصی نیروگاه‌های خورشیدی کوچک‌مقیاس</p>
    <p style="font-size:0.85rem; opacity:0.6; margin-top:12px;">© ۱۴۰۵ تمامی حقوق محفوظ است.</p>
  </div>
</footer>

<script src="../script.js"></script>
<script>
  const articles = [
    {
      slug: "article1",
      title: "برق خورشیدی چیست و چگونه کار می‌کند؟",
      excerpt: "با افزایش مصرف انرژی و اهمیت تأمین برق پایدار، استفاده از انرژی خورشیدی به یکی از راهکارهای مهم برای تولید برق تبدیل شده است. در این مقاله با نحوه تولید برق خورشیدی و اجزای اصلی یک سیستم خورشیدی آشنا می‌شوید.",
      date: "۱۴۰۵/۰۵/۱۵"
    }
  ];

  const grid = document.getElementById('blogGrid');

  if (articles.length === 0) {
    grid.innerHTML = `
      <div class="blog-empty">
        <h3>هنوز مقاله‌ای منتشر نشده است</h3>
        <p>به زودی مقالات تخصصی در این بخش قرار خواهند گرفت.</p>
      </div>
    `;
  } else {
    articles.forEach(article => {
      const card = document.createElement('div');
      card.className = 'blog-card';
      card.innerHTML = `
        <div class="blog-card__image">انرژی خورشیدی</div>
        <div class="blog-card__body">
          <div class="blog-card__date">${article.date}</div>
          <h2 class="blog-card__title">
            <a href="articles/${article.slug}.html">${article.title}</a>
          </h2>
          <p class="blog-card__excerpt">${article.excerpt}</p>
          <a href="articles/${article.slug}.html" class="blog-card__readmore">
            مطالعه بیشتر ←
          </a>
        </div>
      `;
      grid.appendChild(card);
    });
  }
</script>
</body>
