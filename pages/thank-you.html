<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سفارش ثبت شد | برق‌آوران هوراد</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .thank-header {
      padding: 140px 0 40px;
      background: linear-gradient(135deg, #f8fffb, #e6f5ec);
      text-align: center;
    }
    .thank-header .check-icon {
      width: 80px;
      height: 80px;
      background: var(--primary);
      color: var(--white);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .thank-header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--secondary);
      margin-bottom: 8px;
    }
    .thank-header p {
      color: var(--text-light);
      max-width: 600px;
      margin: 0 auto;
    }

    .thank-body {
      padding: 48px 0 80px;
      background: var(--white);
    }
    .thank-content {
      max-width: 820px;
      margin: 0 auto;
    }
    .thank-section {
      background: var(--gray-100);
      padding: 24px 28px;
      border-radius: var(--radius);
      margin-bottom: 24px;
    }
    .thank-section h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary-light);
    }
    .thank-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--gray-200);
      font-size: 0.95rem;
    }
    .thank-row:last-child {
      border-bottom: none;
    }
    .thank-row .label {
      color: var(--text-light);
    }
    .thank-row .value {
      color: var(--secondary);
      font-weight: 600;
      text-align: left;
    }
    .thank-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--gray-200);
      font-size: 0.95rem;
    }
    .thank-item:last-child {
      border-bottom: none;
    }
    .thank-item .name {
      color: var(--secondary);
      font-weight: 600;
    }
    .thank-item .qty {
      color: var(--text-light);
      font-size: 0.85rem;
    }
    .thank-item .price {
      color: var(--primary);
      font-weight: 600;
      white-space: nowrap;
    }
    .thank-total {
      display: flex;
      justify-content: space-between;
      padding-top: 16px;
      margin-top: 8px;
      border-top: 2px solid var(--primary-light);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--secondary);
    }
    .thank-total .amount {
      color: var(--primary);
    }
    .thank-cta {
      text-align: center;
      padding: 32px 24px;
      background: var(--white);
      border: 2px solid var(--primary-light);
      border-radius: var(--radius);
    }
    .thank-cta p {
      color: var(--text-dark);
      margin-bottom: 16px;
      line-height: 1.8;
    }
    .thank-cta .btn {
      display: inline-block;
      padding: 12px 32px;
      border-radius: 50px;
      background: var(--primary);
      color: var(--white);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }
    .thank-cta .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(15, 139, 58, 0.3);
    }
    .thank-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }
    .thank-empty h2 {
      font-size: 1.6rem;
      color: var(--secondary);
      margin-bottom: 8px;
    }

    @media (max-width: 768px) {
      .thank-header h1 {
        font-size: 1.6rem;
      }
      .thank-section {
        padding: 20px;
      }
      .thank-row,
      .thank-item {
        font-size: 0.85rem;
      }
    }
    @media (max-width: 480px) {
      .thank-header h1 {
        font-size: 1.3rem;
      }
      .thank-header .check-icon {
        width: 60px;
        height: 60px;
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<header class="navbar">
  <div class="container navbar__wrapper">
    <a href="../index.html" class="navbar__logo">
      <img src="../assets/images/logo.png" alt="برق‌آوران هوراد" class="logo-image" />
      <span class="logo-text">هوراد</span>
    </a>
    <nav class="navbar__links" id="navbarLinks">
      <a href="../index.html">صفحه اصلی</a>
      <a href="services.html">خدمات</a>
      <a href="projects.html">پروژه‌ها</a>
      <a href="shop.html" class="active">فروشگاه</a>
      <a href="blog.html">مقالات</a>
      <a href="about.html">درباره ما</a>
      <a href="contact.html">تماس با ما</a>
    </nav>
    <div class="navbar__actions">
      <a href="consultation.html" class="btn btn-primary">درخواست مشاوره</a>
      <button class="navbar__toggle" id="menuToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<!-- ===== HEADER ===== -->
<section class="thank-header">
  <div class="container">
    <div class="check-icon">✓</div>
    <h1>سفارش شما با موفقیت ثبت شد</h1>
    <p>کارشناسان ما به زودی با شما تماس خواهند گرفت.</p>
  </div>
</section>

<!-- ===== CONTENT ===== -->
<section class="thank-body">
  <div class="container">
    <div class="thank-content" id="thankContent">
      <div class="thank-empty">
        <p>در حال بارگذاری...</p>
      </div>
    </div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="footer">
  <div class="container">
    <p>برق‌آوران هوراد | مجری تخصصی نیروگاه‌های خورشیدی کوچک‌مقیاس</p>
    <p style="font-size:0.85rem; opacity:0.6; margin-top:12px;">
      © ۱۴۰۵ تمامی حقوق محفوظ است.
    </p>
  </div>
</footer>

<script src="../script.js"></script>
<script>
  function formatPrice(n) {
    return n.toLocaleString('fa-IR') + ' تومان';
  }

  function renderThankYou() {
    const container = document.getElementById('thankContent');

    let order;
    try {
      order = JSON.parse(localStorage.getItem('hoorad_last_order'));
    } catch {}

    if (!order) {
      container.innerHTML = `
        <div class="thank-empty">
          <h2>سفارشی یافت نشد</h2>
          <p><a href="shop.html" style="color:var(--primary);font-weight:600;">بازگشت به فروشگاه</a></p>
        </div>
      `;
      return;
    }

    let itemsHTML = '';
    order.items.forEach(item => {
      itemsHTML += `
        <div class="thank-item">
          <div>
            <div class="name">${item.name}</div>
            <div class="qty">${item.qty} عدد × ${formatPrice(item.price)}</div>
          </div>
          <div class="price">${formatPrice(item.price * item.qty)}</div>
        </div>
      `;
    });

    container.innerHTML = `
      <div class="thank-section">
        <h2>اطلاعات سفارش</h2>
        <div class="thank-row">
          <span class="label">شماره سفارش</span>
          <span class="value">${order.order_number}</span>
        </div>
        <div class="thank-row">
          <span class="label">تاریخ ثبت</span>
          <span class="value">${new Date(order.created_at || Date.now()).toLocaleDateString('fa-IR')}</span>
        </div>
        <div class="thank-row">
          <span class="label">روش ارسال</span>
          <span class="value">${order.shipping_method}</span>
        </div>
      </div>

      <div class="thank-section">
        <h2>اطلاعات خریدار</h2>
        <div class="thank-row">
          <span class="label">نام و نام خانوادگی</span>
          <span class="value">${order.customer_name}</span>
        </div>
        <div class="thank-row">
          <span class="label">شماره تماس</span>
          <span class="value">${order.customer_phone}</span>
        </div>
        <div class="thank-row">
          <span class="label">استان و شهر</span>
          <span class="value">${order.province} - ${order.city}</span>
        </div>
        <div class="thank-row">
          <span class="label">آدرس</span>
          <span class="value">${order.address}</span>
        </div>
        <div class="thank-row">
          <span class="label">کد پستی</span>
          <span class="value">${order.postal_code}</span>
        </div>
        ${order.notes ? `
        <div class="thank-row">
          <span class="label">توضیحات</span>
          <span class="value">${order.notes}</span>
        </div>
        ` : ''}
      </div>

      <div class="thank-section">
        <h2>اقلام سفارش</h2>
        ${itemsHTML}
        <div class="thank-total">
          <span>مجموع</span>
          <span class="amount">${formatPrice(order.total)}</span>
        </div>
      </div>

      <div class="thank-cta">
        <p>
          هزینه ارسال به صورت <strong>پسکرایه</strong> محاسبه می‌شود و هنگام تحویل کالا پرداخت خواهد شد.
        </p>
        <a href="shop.html" class="btn">بازگشت به فروشگاه</a>
      </div>
    `;
  }

  renderThankYou();
</script>
</body>
</html>
