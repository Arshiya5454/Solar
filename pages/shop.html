<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فروشگاه | برق‌آوران هوراد</title>
  <meta name="description" content="فروشگاه تجهیزات خورشیدی برق‌آوران هوراد شامل پنل، اینورتر، باتری و تجهیزات نصب" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    .shop-header {
      padding: 140px 0 40px;
      background: linear-gradient(135deg, #f8fffb, #e6f5ec);
      text-align: center;
    }
    .shop-header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--secondary);
    }
    .shop-header h1 span {
      color: var(--primary);
    }
    .shop-header p {
      color: var(--text-light);
      max-width: 600px;
      margin: 8px auto 0;
    }

    .shop-list {
      padding: 48px 0 80px;
      background: var(--white);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 28px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .product-card {
      background: var(--white);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--gray-200);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: var(--shadow);
    }
    .product-card .image {
      width: 100%;
      height: 220px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .product-card .image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product-card .image .no-image {
      color: var(--primary-dark);
      font-size: 0.9rem;
      font-weight: 500;
    }
    .product-card .body {
      padding: 20px 20px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .product-card .brand {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .product-card .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .product-card .title a {
      color: inherit;
      text-decoration: none;
    }
    .product-card .title a:hover {
      color: var(--primary);
    }
    .product-card .description {
      font-size: 0.9rem;
      color: var(--text-light);
      line-height: 1.7;
      flex: 1;
      margin-bottom: 16px;
    }
    .product-card .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .product-card .price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }
    .product-card .price .discount {
      font-size: 0.85rem;
      color: var(--text-light);
      text-decoration: line-through;
      margin-right: 8px;
      font-weight: 400;
    }
    .product-card .stock {
      font-size: 0.8rem;
      color: var(--text-light);
    }
    .product-card .stock.out {
      color: #e53e3e;
      font-weight: 600;
    }

    .shop-empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-light);
    }
    .shop-empty h3 {
      font-size: 1.6rem;
      color: var(--secondary);
      margin-bottom: 8px;
    }

    @media (max-width: 768px) {
      .shop-header h1 {
        font-size: 2rem;
      }
      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }
      .product-card .image {
        height: 180px;
      }
    }

    @media (max-width: 480px) {
      .shop-header h1 {
        font-size: 1.6rem;
      }
      .products-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .product-card .image {
        height: 140px;
      }
      .product-card .body {
        padding: 12px 14px 16px;
      }
      .product-card .title {
        font-size: 0.95rem;
      }
      .product-card .description {
        font-size: 0.8rem;
      }
      .product-card .price {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<header class="navbar">
  <div class="container navbar__wrapper">
    <a href="../index.html" class="navbar__logo">
      <img src="../assets/images/logo.png" alt="برق‌آوران هوراد" class="logo-image" />
      <span class="logo-text">هوراد</span>
    </a>
    <nav class="navbar__links" id="navbarLinks">
      <a href="../index.html">صفحه اصلی</a>
      <a href="services.html">خدمات</a>
      <a href="projects.html">پروژه‌ها</a>
      <a href="shop.html" class="active">فروشگاه</a>
      <a href="blog.html">مقالات</a>
      <a href="about.html">درباره ما</a>
      <a href="contact.html">تماس با ما</a>
    </nav>
    <div class="navbar__actions">
      <a href="consultation.html" class="btn btn-primary">درخواست مشاوره</a>
      <button class="navbar__toggle" id="menuToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
 

<!-- ===== HEADER ===== -->
<section class="shop-header">
  <div class="container">
    <h1>فروشگاه <span>تجهیزات خورشیدی</span></h1>
    <p>تأمین پنل، اینورتر، باتری و کلیه تجهیزات مورد نیاز نیروگاه خورشیدی</p>
  </div>
</section>

<!-- ===== PRODUCTS LIST ===== -->
<section class="shop-list">
  <div class="container">
    <div class="products-grid" id="productsGrid">
      <div class="shop-empty" style="grid-column: 1 / -1;">
        <p>در حال بارگذاری محصولات...</p>
      </div>
    </div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="footer">
  <div class="container">
    <p>برق‌آوران هوراد | مجری تخصصی نیروگاه‌های خورشیدی کوچک‌مقیاس</p>
    <p style="font-size:0.85rem; opacity:0.6; margin-top:12px;">
      © ۱۴۰۵ تمامی حقوق محفوظ است.
    </p>
  </div>
</footer>

<script src="../script.js"></script>
<script>
  const API_BASE = 'https://hooradsolar.com/api';

  async function loadProducts() {
    const grid = document.getElementById('productsGrid');

    try {
      const res = await fetch(`${API_BASE}/products`);
      const products = await res.json();

      if (products.length === 0) {
        grid.innerHTML = `
          <div class="shop-empty" style="grid-column: 1 / -1;">
            <h3>هنوز محصولی ثبت نشده است</h3>
            <p>به زودی محصولات در این بخش قرار خواهند گرفت.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = '';

      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';

        const price = p.discount_price
          ? `<span class="discount">${p.price.toLocaleString()}</span>${p.discount_price.toLocaleString()} تومان`
          : `${p.price.toLocaleString()} تومان`;

        const stock = p.stock > 0
          ? `<span class="stock">موجود: ${p.stock}</span>`
          : `<span class="stock out">ناموجود</span>`;

        const image = p.main_image
          ? `<img src="${p.main_image}" alt="${p.name}" />`
          : `<span class="no-image">بدون تصویر</span>`;

        card.innerHTML = `
          <div class="image">${image}</div>
          <div class="body">
            ${p.brand ? `<div class="brand">${p.brand}</div>` : ''}
            <div class="title">
              <a href="product.html?slug=${p.slug}">${p.name}</a>
            </div>
            <div class="description">${p.description || ''}</div>
            <div class="footer">
              <div class="price">${price}</div>
              ${stock}
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    } catch (err) {
      grid.innerHTML = `
        <div class="shop-empty" style="grid-column: 1 / -1;">
          <h3>خطا در بارگذاری محصولات</h3>
          <p>لطفاً بعداً دوباره تلاش کنید.</p>
        </div>
      `;
      console.error(err);
    }
  }

  loadProducts();
</script>
</body>
</html>
