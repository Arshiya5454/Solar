<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جزئیات محصول | برق‌آوران هوراد</title>
  <meta name="description" content="جزئیات محصول - فروشگاه تجهیزات خورشیدی برق‌آوران هوراد" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    .product-header {
      padding: 140px 0 40px;
      background: linear-gradient(135deg, #f8fffb, #e6f5ec);
    }
    .product-header .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
    }
    .product-header .back {
      display: inline-block;
      margin-bottom: 12px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .product-header .back:hover {
      text-decoration: underline;
    }
    .product-header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--secondary);
      line-height: 1.4;
    }
    .product-header .brand {
      color: var(--text-light);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .cart-link {
      display: inline-block;
      padding: 10px 20px;
      background: var(--primary);
      color: var(--white);
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: var(--transition);
      white-space: nowrap;
    }
    .cart-link:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(15, 139, 58, 0.3);
    }

    .product-body {
      padding: 48px 0 80px;
      background: var(--white);
    }

    .product-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ===== IMAGE SIDE ===== */
    .product-image-box {
      background: var(--gray-100);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--gray-200);
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .product-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product-image-box .no-image {
      color: var(--text-light);
      font-size: 1rem;
    }

    .product-gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .product-gallery img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: var(--transition);
    }
    .product-gallery img:hover {
      border-color: var(--primary);
    }

    /* ===== INFO SIDE ===== */
    .product-info h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 8px;
    }
    .product-info .sku {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-bottom: 16px;
    }
    .product-info .price-box {
      background: var(--gray-100);
      padding: 20px 24px;
      border-radius: var(--radius);
      margin-bottom: 20px;
    }
    .product-info .price {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary);
    }
    .product-info .discount-price {
      font-size: 1rem;
      color: var(--text-light);
      text-decoration: line-through;
      margin-right: 12px;
      font-weight: 400;
    }
    .product-info .stock {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-top: 4px;
    }
    .product-info .stock.out {
      color: #e53e3e;
      font-weight: 600;
    }

    .product-info .description {
      font-size: 1rem;
      line-height: 1.9;
      color: var(--text-dark);
      margin-bottom: 24px;
    }

    .product-info .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .product-info .btn {
      flex: 1;
      padding: 14px 24px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      text-align: center;
      transition: var(--transition);
    }
    .btn-primary {
      background: var(--primary);
      color: var(--white);
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(15, 139, 58, 0.3);
    }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    .btn-outline:hover {
      background: var(--primary);
      color: var(--white);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ===== SECTIONS BELOW ===== */
    .product-sections {
      padding: 48px 0 80px;
      background: var(--gray-100);
    }
    .product-sections .section {
      max-width: 1100px;
      margin: 0 auto 32px;
      background: var(--white);
      padding: 32px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .product-sections .section:last-child {
      margin-bottom: 0;
    }
    .product-sections h3 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary-light);
    }
    .product-sections .content {
      font-size: 1rem;
      line-height: 2;
      color: var(--text-dark);
    }
    .product-sections .specs-table {
      width: 100%;
      border-collapse: collapse;
    }
    .product-sections .specs-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--gray-200);
      font-size: 0.95rem;
    }
    .product-sections .specs-table td:first-child {
      font-weight: 600;
      color: var(--secondary);
      width: 30%;
    }

    .loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-light);
      font-size: 1.1rem;
    }
    .error-box {
      text-align: center;
      padding: 80px 20px;
    }
    .error-box h2 {
      font-size: 1.6rem;
      color: var(--secondary);
      margin-bottom: 8px;
    }
    .error-box a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .error-box a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .product-layout {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .product-image-box {
        height: 300px;
      }
      .product-header h1 {
        font-size: 1.4rem;
      }
      .product-info h2 {
        font-size: 1.3rem;
      }
      .product-info .price {
        font-size: 1.3rem;
      }
      .product-gallery img {
        height: 60px;
      }
      .product-sections .section {
        padding: 20px;
      }
    }

    @media (max-width: 480px) {
      .product-header h1 {
        font-size: 1.2rem;
      }
      .product-image-box {
        height: 220px;
      }
      .product-gallery {
        grid-template-columns: repeat(3, 1fr);
      }
      .product-sections h3 {
        font-size: 1.1rem;
      }
      .product-sections .specs-table td {
        padding: 8px 12px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<header class="navbar">
  <div class="container navbar__wrapper">
    <a href="../index.html" class="navbar__logo">
      <img src="../assets/images/logo.png" alt="برق‌آوران هوراد" class="logo-image" />
      <span class="logo-text">هوراد</span>
    </a>
    <nav class="navbar__links" id="navbarLinks">
      <a href="../index.html">صفحه اصلی</a>
      <a href="services.html">خدمات</a>
      <a href="projects.html">پروژه‌ها</a>
      <a href="shop.html" class="active">فروشگاه</a>
      <a href="blog.html">مقالات</a>
      <a href="about.html">درباره ما</a>
      <a href="contact.html">تماس با ما</a>
    </nav>
    <div class="navbar__actions">
      <a href="consultation.html" class="btn btn-primary">درخواست مشاوره</a>
      <button class="navbar__toggle" id="menuToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<!-- ===== CONTENT ===== -->
<div id="productContent">
  <div class="loading">در حال بارگذاری...</div>
</div>

<!-- ===== FOOTER ===== -->
<footer class="footer">
  <div class="container">
    <p>برق‌آوران هوراد | مجری تخصصی نیروگاه‌های خورشیدی کوچک‌مقیاس</p>
    <p style="font-size:0.85rem; opacity:0.6; margin-top:12px;">
      © ۱۴۰۵ تمامی حقوق محفوظ است.
    </p>
  </div>
</footer>

<script src="../script.js"></script>
<script>
  const API_BASE = 'https://hooradsolar.com/api';
  const CART_KEY = 'hoorad_cart';

  function getSlug() {
    const params = new URLSearchParams(window.location.search);
    return params.get('slug');
  }

  function updateCartCount() {
    try {
      const cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
      const count = cart.reduce((s, i) => s + i.qty, 0);
      const el = document.getElementById('cartCount');
      if (el) el.textContent = count;
    } catch {}
  }

  async function loadProduct() {
    const slug = getSlug();
    const container = document.getElementById('productContent');

    if (!slug) {
      container.innerHTML = `
        <div class="error-box">
          <h2>محصول یافت نشد</h2>
          <p><a href="shop.html">بازگشت به فروشگاه</a></p>
        </div>
      `;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/products/${slug}`);
      if (!res.ok) {
        container.innerHTML = `
          <div class="error-box">
            <h2>محصول یافت نشد</h2>
            <p><a href="shop.html">بازگشت به فروشگاه</a></p>
          </div>
        `;
        return;
      }
      const p = await res.json();
      renderProduct(p);
      updateCartCount();
    } catch (err) {
      container.innerHTML = `
        <div class="error-box">
          <h2>خطا در بارگذاری محصول</h2>
          <p><a href="shop.html">بازگشت به فروشگاه</a></p>
        </div>
      `;
    }
  }

  function renderProduct(p) {
    const container = document.getElementById('productContent');

    const priceHTML = p.discount_price
      ? `${p.discount_price.toLocaleString()} تومان <span class="discount-price">${p.price.toLocaleString()}</span>`
      : `${p.price.toLocaleString()} تومان`;

    const stockHTML = p.stock > 0
      ? `<div class="stock">موجود در انبار: ${p.stock} عدد</div>`
      : `<div class="stock out">ناموجود</div>`;

    const mainImage = p.main_image
      ? `<img src="${p.main_image}" alt="${p.name}" id="mainProductImage" />`
      : `<span class="no-image">تصویری برای این محصول ثبت نشده است</span>`;

    let galleryHTML = '';
    if (p.images && Array.isArray(p.images) && p.images.length > 0) {
      galleryHTML = `<div class="product-gallery">`;
      p.images.forEach(img => {
        galleryHTML += `<img src="${img}" alt="${p.name}" onclick="document.getElementById('mainProductImage').src='${img}'" />`;
      });
      galleryHTML += `</div>`;
    }

    let specsHTML = '';
    if (p.specs && typeof p.specs === 'object') {
      specsHTML = `<div class="section">
        <h3>مشخصات فنی</h3>
        <table class="specs-table">`;
      Object.entries(p.specs).forEach(([key, value]) => {
        specsHTML += `<tr><td>${key}</td><td>${value}</td></tr>`;
      });
      specsHTML += `</table></div>`;
    }

    let reviewHTML = '';
    if (p.full_review) {
      reviewHTML = `<div class="section">
        <h3>نقد و بررسی کامل</h3>
        <div class="content">${p.full_review}</div>
      </div>`;
    }

    const addToCartHTML = p.stock > 0
      ? `<button class="btn btn-primary" onclick="addToCart('${p.slug}')">افزودن به سبد خرید</button>`
      : `<button class="btn btn-primary" disabled>ناموجود</button>`;

    container.innerHTML = `
      <section class="product-header">
        <div class="container">
          <div class="header-row">
            <div>
              <a href="shop.html" class="back">← بازگشت به فروشگاه</a>
              <h1>${p.name}</h1>
              ${p.brand ? `<div class="brand">${p.brand}${p.model ? ' - ' + p.model : ''}</div>` : ''}
            </div>
            <a href="cart.html" class="cart-link">🛒 سبد خرید (<span id="cartCount">0</span>)</a>
          </div>
        </div>
      </section>

      <section class="product-body">
        <div class="container">
          <div class="product-layout">
            <div>
              <div class="product-image-box">${mainImage}</div>
              ${galleryHTML}
            </div>
            <div class="product-info">
              <h2>${p.name}</h2>
              ${p.sku ? `<div class="sku">کد محصول: ${p.sku}</div>` : ''}
              <div class="price-box">
                <div class="price">${priceHTML}</div>
                ${stockHTML}
              </div>
              <div class="description">${p.description || ''}</div>
              <div class="actions">
                ${addToCartHTML}
              </div>
            </div>
          </div>
        </div>
      </section>

      ${(specsHTML || reviewHTML) ? `
        <section class="product-sections">
          ${specsHTML}
          ${reviewHTML}
        </section>
      ` : ''}
    `;

    updateCartCount();
  }

  function addToCart(slug) {
    fetch(`${API_BASE}/products/${slug}`)
      .then(res => res.json())
      .then(p => {
        let cart = [];
        try {
          cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
        } catch {}

        const existing = cart.find(item => item.slug === p.slug);
        const price = p.discount_price || p.price;

        if (existing) {
          existing.qty += 1;
        } else {
          cart.push({
            slug: p.slug,
            name: p.name,
            price: price,
            image: p.main_image || '',
            qty: 1
          });
        }

        localStorage.setItem(CART_KEY, JSON.stringify(cart));
        updateCartCount();
        alert('محصول به سبد خرید اضافه شد');
      })
      .catch(() => alert('خطا در افزودن به سبد خرید'));
  }

  loadProduct();
</script>
</body>
</html>
