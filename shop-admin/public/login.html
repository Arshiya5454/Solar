<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود | مدیریت</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      direction: rtl;
    }
    .login-box {
      background: #fff;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 360px;
    }
    .login-box h1 {
      font-size: 1.6rem;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .login-box .sub {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .login-box label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .login-box input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 16px;
    }
    .login-box input:focus {
      border-color: #0f8b3a;
      outline: none;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: #0f8b3a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .login-box button:hover {
      background: #0a6b2c;
    }
    .login-box .error {
      color: #e53e3e;
      font-size: 0.9rem;
      margin-top: 12px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>ورود</h1>
    <div class="sub">پنل مدیریت</div>
    <form id="loginForm">
      <label>نام کاربری</label>
      <input type="text" id="username" placeholder="نام کاربری" required />
      <label>رمز عبور</label>
      <input type="password" id="password" placeholder="رمز عبور" required />
      <button type="submit">ورود</button>
      <div class="error" id="loginError">نام کاربری یا رمز عبور اشتباه است</div>
    </form>
  </div>
  <script>
    // Hardcoded credentials (change these)
    const VALID_USERNAME = 'admin';
    const VALID_PASSWORD = 'hoorad123';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      if (u === VALID_USERNAME && p === VALID_PASSWORD) {
        localStorage.setItem('adminLoggedIn', 'true');
        window.location.href = 'orders.html';
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    });
  </script>
</body>
</html>
